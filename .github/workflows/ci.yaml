name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint-data

  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check-format

  check-templates:
    runs-on: ubuntu-latest
    env:
      GOTMPLFMT_VERSION: 0.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install gotmplfmt
        run: |
          curl -fsSL -o gotmplfmt.tar.gz \
            "https://github.com/gohugoio/gotmplfmt/releases/download/v${GOTMPLFMT_VERSION}/gotmplfmt_${GOTMPLFMT_VERSION}_linux-amd64.tar.gz"
          tar -xzf gotmplfmt.tar.gz gotmplfmt
          install -m 755 gotmplfmt /usr/local/bin/gotmplfmt
      - name: Check Hugo template formatting
        run: |
          if ! output=$(gotmplfmt -l layouts content) || [ -n "$output" ]; then
            echo "These templates are not formatted. Run 'bun run format':"
            echo "$output"
            exit 1
          fi
